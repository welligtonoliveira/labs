version: '3.8'

services:
  locust:
    image: locustio/locust:2.29.0
    container_name: locust_stress_loans
    ports:
      - "8089:8089"
    volumes:
      - .:/mnt/locust
    environment:
      - AUTHORIZATION_TOKEN=${AUTHORIZATION_TOKEN:-a267b223-c52f-4d35-8f8a-33d28577a4f7}
    command: -f /mnt/locust/locustfile.py

